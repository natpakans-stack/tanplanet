<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MegaCoach</title>
<meta name="theme-color" content="#17151F">
<script>/* ธีม: ค่าเริ่มต้นมืด · เลือกได้ในเมนู ⋯ (mc_theme = dark | light | system) — ตั้งก่อนวาดหน้า กันกระพริบ */
try { var t = localStorage.getItem("mc_theme") || "dark"; if (t !== "system") document.documentElement.dataset.theme = t; } catch (e) { document.documentElement.dataset.theme = "dark"; }</script>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<!-- Realfact Design (แบรนด์ takra) + สีแบรนด์ม่วง megacoach — สร้างด้วย megacoach/wealth-board/build.mjs ห้ามแก้มือ -->
<link rel="stylesheet" href="wb/reset.css">
<link rel="stylesheet" href="wb/takra.css">
<link rel="stylesheet" href="wb/brand-megacoach.css">
<link rel="stylesheet" href="wb/realfact.css">
<style>
  /* โครงหน้าเท่านั้น — ระยะทั้งหมดเป็น token ของ DS · gutter มีเจ้าของคนเดียว (.wb) */
  body { margin: 0; background: var(--rf-surface-sunken); color: var(--rf-text); font-family: var(--rf-font-family-body); }
  /* gutter เดียวทั้งหน้า: มือถือ = space-200 · จอกว้าง = เนื้อหากว้างสุด 1200px อยู่กลางจอ (หัว แท็บ การ์ด ตรงแนวเดียวกัน) */
  :root { --mc-gut: max(var(--rf-space-200), calc((100vw - 1200px) / 2)); }
  .mc { display: flex; flex-direction: column; gap: var(--rf-space-200);
        padding: 0 var(--mc-gut) calc(env(safe-area-inset-bottom) + var(--rf-space-1000)); }
  /* แถบหัวเต็มกว้าง ต่อกับแถบแท็บเป็นผืนเดียว (แท็บติดขอบบนเมื่อเลื่อน) */
  .mc-top { margin-inline: calc(-1 * var(--mc-gut)); margin-block-end: calc(-1 * var(--rf-space-200));
            padding: calc(env(safe-area-inset-top) + var(--rf-space-200)) var(--mc-gut) 0; background: var(--rf-surface); position: relative; }
  .mc-menu { position: absolute; inset-block-start: calc(env(safe-area-inset-top) + var(--rf-space-200)); inset-inline-end: var(--mc-gut); }
  /* ranking: ชื่อบนบรรทัดเดียว · meta ใต้ชื่อเสมอ 1 บรรทัด (ตัด …) · ระยะแถวแน่นขึ้น — ponytail: ข้อความเต็มดูที่ "ดูเป็นตาราง" */
  .mc .rfd-ranking { gap: var(--rf-space-100); }
  .mc .rfd-ranking__body { gap: 2px; }
  .mc .rfd-ranking__label { display: grid; }
  .mc .rfd-ranking__rank { text-align: start; min-width: 1.5rem; font-variant-numeric: tabular-nums; }   /* เลขลำดับชิดซ้ายตรงขอบหัวการ์ด */
  .mc .rfd-ranking__meta { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mc .rfd-tabs__list { position: sticky; top: 0; z-index: 5; margin-inline: calc(-1 * var(--mc-gut));
            padding-inline: var(--mc-gut); padding-block: calc(env(safe-area-inset-top) + var(--rf-space-200)) var(--rf-space-100); /* แท็บมีระยะบน-ล่าง ไม่ชิดขอบจอตอนติดบนสุด */ background: var(--rf-surface); }
  /* ---------- หน้าปลดล็อก (Glam: แสงแบรนด์ลอดหลัง · เกจเข็มกวาด · การ์ดกระจกฝ้า) ---------- */
  .mc-gate { position: relative; min-height: 100dvh; justify-content: center; align-items: center; overflow: hidden; isolation: isolate;
             padding-block: calc(env(safe-area-inset-top) + var(--rf-space-800)) calc(env(safe-area-inset-bottom) + var(--rf-space-800)); --mx: 0; --my: 0; }
  .mc-gate__aura { position: absolute; inset: -20%; z-index: -2; filter: blur(64px); opacity: .85;
                   transform: translate(calc(var(--mx) * -18px), calc(var(--my) * -18px)); transition: transform .6s ease-out; }
  .mc-gate__aura i { position: absolute; border-radius: 50%; display: block; mix-blend-mode: screen; }
  .mc-gate__aura i:nth-child(1) { width: 52vmax; height: 52vmax; left: 8%; top: 4%; background: radial-gradient(circle, var(--rf-chart-brand) 0%, transparent 62%); animation: mc-drift-a 18s ease-in-out infinite alternate; }
  .mc-gate__aura i:nth-child(2) { width: 44vmax; height: 44vmax; right: 2%; top: 30%; background: radial-gradient(circle, var(--rf-background-brand-bold) 0%, transparent 60%); animation: mc-drift-b 22s ease-in-out infinite alternate; }
  .mc-gate__aura i:nth-child(3) { width: 36vmax; height: 36vmax; left: 30%; bottom: 0; background: radial-gradient(circle, var(--rf-chart-success, #2FA36B) 0%, transparent 60%); opacity: .35; animation: mc-drift-c 26s ease-in-out infinite alternate; }
  [data-theme="light"] .mc-gate__aura { opacity: .45; }
  [data-theme="light"] .mc-gate__aura i { mix-blend-mode: multiply; }
  .mc-gate__grid { position: absolute; inset: 0; z-index: -1; opacity: .5;
                   background-image: radial-gradient(color-mix(in srgb, var(--rf-text) 22%, transparent) 1px, transparent 1px); background-size: 22px 22px;
                   -webkit-mask-image: radial-gradient(ellipse 60% 55% at 50% 45%, #000 30%, transparent 75%); mask-image: radial-gradient(ellipse 60% 55% at 50% 45%, #000 30%, transparent 75%); }
  .mc-gate__menu { position: absolute; inset-block-start: calc(env(safe-area-inset-top) + var(--rf-space-200)); inset-inline-end: var(--rf-space-200); z-index: 2; }
  /* ขนาดตามความสูงจอ: เกจ + การ์ดพอดีจอเสมอ (จอเตี้ย = เกจเล็กลง · จอเตี้ยมาก/แนวนอน = ซ่อนเกจ) */
  .mc-gate__body { inline-size: min(100%, 26rem); display: flex; flex-direction: column; align-items: center; gap: clamp(var(--rf-space-200), 3.5dvh, var(--rf-space-600)); }
  .mc-gate__hero { inline-size: clamp(9rem, 42dvh, 24rem); max-inline-size: 86vw; transform: translate(calc(var(--mx) * 10px), calc(var(--my) * 8px)) rotate(calc(var(--mx) * 2deg)); transition: transform .4s ease-out;
                   filter: drop-shadow(0 12px 32px color-mix(in srgb, var(--rf-background-brand-bold) 45%, transparent)); }
  .mc-gauge { display: block; inline-size: 100%; block-size: auto; overflow: visible; }
  .mc-gauge path { fill: none; stroke-linecap: butt; }
  .mc-gauge__track { stroke: color-mix(in srgb, var(--rf-text) 10%, transparent); stroke-width: 22; }
  .mc-gauge__zone { stroke-width: 22; stroke-dasharray: 0 400; animation: mc-zone 1.1s cubic-bezier(.2,.8,.2,1) forwards; }
  .mc-gauge__zone--go { stroke: #36CB7B; } .mc-gauge__zone--ok { stroke: #80C661; animation-delay: .1s; } .mc-gauge__zone--wait { stroke: #F5A64A; animation-delay: .2s; } .mc-gauge__zone--avoid { stroke: #F22154; animation-delay: .3s; }
  .mc-gauge__ticks line { stroke: color-mix(in srgb, var(--rf-text) 45%, transparent); stroke-width: 2; stroke-linecap: round; }
  .mc-gauge__needle { transform-origin: 140px 140px; transform: rotate(-88deg); animation: mc-needle 2.2s cubic-bezier(.3,.7,.3,1) .4s forwards, mc-rev 5.5s cubic-bezier(.3,.7,.3,1) 3.2s infinite; }
  .mc-gauge__shake { transform-origin: 140px 140px; animation: mc-shake .12s linear infinite alternate; }
  .mc-gauge__needle path { fill: var(--rf-text); }
  .mc-gauge__hub { fill: none !important; stroke: var(--rf-text); stroke-width: 7; }
  /* หัวการ์ดปลดล็อก: โลโก้ + คำอธิบายอยู่กลาง (แกนเดียวกับเกจด้านบน) · ตัดบรรทัดสมดุล ไม่เหลือคำโดด */
  .mc-gate__card .rfd-card__heading { align-items: center; text-align: center; }
  .mc-gate__card .rfd-card__title { display: flex; justify-content: center; }
  .mc-gate__card .rfd-card__description { text-wrap: balance; margin-block-start: var(--rf-space-150); }
  .mc-gate__card { inline-size: 100%; animation: mc-rise .7s cubic-bezier(.2,.8,.2,1) .2s both; }
  /* การ์ดกระจกฝ้า: พื้นโปร่ง + blur + เส้นขอบใส + ไฮไลต์ขอบบน */
  .mc-gate__card .rfd-card { background: color-mix(in srgb, var(--rf-surface-raised) 62%, transparent); -webkit-backdrop-filter: blur(18px) saturate(140%); backdrop-filter: blur(18px) saturate(140%);
                             border-color: color-mix(in srgb, var(--rf-text) 14%, transparent);
                             box-shadow: inset 0 1px 0 color-mix(in srgb, #fff 18%, transparent), 0 24px 64px -16px color-mix(in srgb, #000 55%, transparent); }
  @media (max-height: 520px) { .mc-gate__hero { display: none; } }
  @keyframes mc-drift-a { to { transform: translate(14%, 10%) scale(1.15); } }
  @keyframes mc-drift-b { to { transform: translate(-16%, -8%) scale(.9); } }
  @keyframes mc-drift-c { to { transform: translate(10%, -14%) scale(1.2); } }
  @keyframes mc-zone { to { stroke-dasharray: 400 0; } }
  /* สตาร์ทเครื่อง: เข็มฟาดไปเรดไลน์ → เด้งกลับ → ตั้งที่รอบเดินเบา · แล้วเร่งเครื่องเป็นจังหวะ + สั่นเบา ๆ */
  @keyframes mc-needle { 0% { transform: rotate(-88deg); } 30% { transform: rotate(82deg); } 40% { transform: rotate(70deg); } 58% { transform: rotate(-34deg); }
                         72% { transform: rotate(8deg); } 86% { transform: rotate(-14deg); } 100% { transform: rotate(-6deg); } }
  @keyframes mc-rev { 0%, 100% { transform: rotate(-6deg); } 7% { transform: rotate(58deg); } 11% { transform: rotate(48deg); } 15% { transform: rotate(74deg); }
                      22% { transform: rotate(64deg); } 34% { transform: rotate(-12deg); } 42% { transform: rotate(-4deg); } 50% { transform: rotate(-6deg); } }
  @keyframes mc-shake { from { transform: rotate(-1.2deg); } to { transform: rotate(1.2deg); } }
  @keyframes mc-rise { from { opacity: 0; transform: translateY(16px); } }
  @media (prefers-reduced-motion: reduce) {
    .mc-gate__aura i, .mc-gauge__zone, .mc-gauge__needle, .mc-gauge__shake, .mc-gate__card { animation: none !important; }
    .mc-gauge__zone { stroke-dasharray: none; } .mc-gauge__needle { transform: rotate(-6deg); }
    .mc-gate__aura, .mc-gate__hero { transform: none; }
  }
  /* คู่ซ้าย-ขวา (<Pair>) — จับคู่แบบตั้งใจใน JSX ไม่ให้ CSS เดาเอง · การ์ดในแถวสูงเท่ากัน */
  /* ช่องรอรูปสมุดบัญชีในแผงข้าง — กรอบเส้นประบอกว่ารูปจะมาอยู่ตรงนี้ */
  .mc-slot { display: grid; place-items: center; padding: var(--rf-space-300); border: 1px dashed var(--rf-border-bold); border-radius: var(--rf-radius-large); }
  .mc-pair { display: grid; gap: var(--rf-space-200); align-items: stretch; }
  .mc-pair > * { min-inline-size: 0; align-self: stretch; } /* การ์ดตัวเลือกของ DS ตั้ง align-self: start ไว้ */
  @media (min-width: 1024px) { .mc-pair { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  /* 3 คอลัมน์บนเดสก์ท็อป (ภาพรวม: เป้าหมาย · ความมั่งคั่ง · สุขภาพการเงิน) · ลูกที่เป็น StatGrid ยืดเต็มช่อง */
  .mc-trio { display: grid; gap: var(--rf-space-200); align-items: stretch; }
  .mc-trio > * { min-inline-size: 0; }
  .mc-trio > .rfd-stat-grid { grid-template-columns: 1fr; }
  /* กลุ่ม 4 การ์ด: แคบ = 2×2 · กว้าง (≥ 4 × 12rem) = 4 คอลัมน์ · ไม่ให้ตกเป็น 3+1 */
  .mc .rfd-stat-grid:has(> :nth-child(4):last-child) { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  @media (min-width: 900px) { .mc .rfd-stat-grid:has(> :nth-child(4):last-child) { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
  @media (max-width: 359px) { .mc .rfd-stat-grid:has(> :nth-child(4):last-child) { grid-template-columns: 1fr; } }
  .mc-trio .rfd-stat-tile { block-size: 100%; }
  @media (min-width: 1024px) { .mc-trio { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  /* ป้ายเกรด: กว้างเท่ากัน วางหน้าตัวเลข */
  /* สุขภาพการเงิน: 1 ข้อ = 1 บล็อก · ป้ายเกรดซ้าย · ชื่อ+ค่าบรรทัดเดียว · เกณฑ์ · กล่องคำแนะนำ · เส้นคั่นระหว่างข้อ */
  .mc-hc-cols .rfd-section-heading { font: var(--rf-font-heading-xsmall); margin: 0; }
  @media (min-width: 1024px) { .mc-hc-cols { column-gap: var(--rf-space-300); } .mc-hc-cols > * + * { border-inline-start: 1px solid var(--rf-border); padding-inline-start: var(--rf-space-300); } }
  .mc-hc--compact .mc-hc__item { padding-block: var(--rf-space-100); }
  /* กรมธรรม์: 2 คอลัมน์ × 2 แถว (จอกว้าง) · ชื่อเต็ม ไม่ตัด … */
  @media (min-width: 768px) { .mc-ins.rfd-card-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: 1fr; } }
  .mc-ins .rfd-description-list { --rfd-dl-min: 7.5rem; }   /* รายละเอียดกรมธรรม์ 2 คอลัมน์แม้การ์ดแคบ (DS ยุบที่ < 28rem) */
  .mc-ins .rfd-card__title-row > .rfd-card__title { white-space: normal; overflow: visible; text-overflow: clip; }
  /* ภาพรวม: ทั้งแถวกดได้ → สลับไปแท็บของข้อนั้น */
  .mc-hc__go { inline-size: 100%; margin: 0; border: 0; background: none; color: inherit; font: inherit; text-align: start; cursor: pointer; border-radius: var(--rf-radius-small); padding-inline: var(--rf-space-100); }
  .mc-hc li + li .mc-hc__go { border-top: 1px solid var(--rf-border); border-radius: 0; }
  .mc-hc__go:hover { background: var(--rf-surface-raised); }
  .mc-hc__go:focus-visible { outline: 2px solid var(--rf-border-focused); outline-offset: -2px; }
  .mc-hc__to { display: inline-flex; align-items: center; gap: var(--rf-space-050); font: var(--rf-font-body-small); color: var(--rf-text-subtle); }
  .mc-hc__go:hover .mc-hc__to { color: var(--rf-text); }
  /* ⓘ สูตร: ปุ่มข้างชื่อ (แท็บ) / ข้างแถว (ภาพรวม) · ตารางช่วงคะแนนในชีต */
  .mc-hc__name { display: inline-flex; align-items: center; gap: var(--rf-space-100); }
  .mc-hc--compact li { display: flex; align-items: flex-start; }
  .mc-hc--compact li > .mc-hc__go { flex: 1; min-inline-size: 0; }
  .mc-hc__info { padding-block-start: var(--rf-space-100); }
  .mc-hc--compact li + li { border-top: 1px solid var(--rf-border); }
  .mc-hc--compact li + li .mc-hc__go { border-top: 0; }
  .mc-hc__ask { display: flex; justify-content: flex-end; margin-top: var(--rf-space-200); padding-top: var(--rf-space-200); border-top: 1px solid var(--rf-border); }
  /* สูตรแบบเศษส่วน: ตัวเศษ / เส้น / ตัวส่วน */
  .mc-fx { display: grid; gap: var(--rf-space-150); padding: var(--rf-space-200); border-radius: var(--rf-radius-small); background: var(--rf-surface-sunken); }
  .mc-fx__row { display: flex; flex-wrap: wrap; align-items: center; gap: var(--rf-space-100); }
  .mc-fx__row--num { font-variant-numeric: tabular-nums; }
  .mc-fx__row > span:first-child { color: var(--rf-text-subtle); }
  .mc-frac { display: inline-grid; text-align: center; vertical-align: middle; }
  .mc-frac__n { padding: 0 var(--rf-space-050) var(--rf-space-050); border-bottom: 1px solid currentColor; }
  .mc-frac__d { padding: var(--rf-space-050) var(--rf-space-050) 0; }
  /* ผลตรวจสุขภาพ: ชื่อ · ค่า · เกณฑ์ · สถานะ */
  .mc-labs { list-style: none; margin: 0; padding: 0; }
  .mc-lab { display: grid; grid-template-columns: minmax(0, 1fr) 8.5rem 5rem 4.75rem; align-items: center; gap: var(--rf-space-050) var(--rf-space-150); padding-block: var(--rf-space-100); font-variant-numeric: tabular-nums; }
  .mc-lab + .mc-lab { border-top: 1px solid var(--rf-border); }
  .mc-lab > :nth-child(5) { grid-column: 1 / -1; }
  .mc-lab__v { display: grid; gap: 2px; }
  .mc-lab__unit { font: var(--rf-font-body-small); color: var(--rf-text-subtle); }
  .mc-lab > .rfd-lozenge, .mc-lab > :nth-child(4) { justify-self: end; }
  .mc-lab__ref, .mc-lab__prev { font: var(--rf-font-body-small); color: var(--rf-text-subtle); }
  @media (max-width: 599px) { .mc-lab { grid-template-columns: minmax(0, 1fr) 7rem 4.75rem; } .mc-lab__ref { display: none; } }
  .mc-lab__tr { font: var(--rf-font-body-small); color: var(--rf-text-subtle); white-space: nowrap; }
  .mc-lab__tr.is-better { color: var(--rf-text-success); }
  .mc-lab__tr.is-worse { color: var(--rf-text-danger); }
  /* หน้าตั้งค่า */
  .mc-keys { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(16rem, 1fr)); gap: var(--rf-space-100) var(--rf-space-300); }
  .mc-keys li { display: flex; justify-content: space-between; align-items: center; gap: var(--rf-space-150); padding-block: var(--rf-space-075); border-bottom: 1px solid var(--rf-border); }
  .mc-id { overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
  .mc-prompt { margin: 0; white-space: pre-wrap; word-break: break-word; font: var(--rf-font-body-small); line-height: 1.7; padding: var(--rf-space-200); border-radius: var(--rf-radius-small); background: var(--rf-surface-sunken); max-block-size: 32rem; overflow: auto; }
  .mc-labgroups { display: grid; gap: var(--rf-space-300); }
  @media (min-width: 1024px) { .mc-labgroups { grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: var(--rf-space-400); } }
  .mc-plan { margin: 0; padding-inline-start: var(--rf-space-250); display: grid; gap: var(--rf-space-100); }
  .mc-scale { list-style: none; margin: 0; padding: 0; display: grid; gap: var(--rf-space-050); }
  .mc-scale li { display: grid; grid-template-columns: 3rem 1fr auto; align-items: center; gap: var(--rf-space-150); padding: var(--rf-space-075) var(--rf-space-100); border-radius: var(--rf-radius-small); }
  .mc-scale li.is-current { background: var(--rf-surface-sunken); outline: 1px solid var(--rf-border-bold); }
  .mc-scale__pt { font: var(--rf-font-body-small); color: var(--rf-text-subtle); font-variant-numeric: tabular-nums; }
  .mc-hc { list-style: none; margin: 0; padding: 0; }
  .mc-hc__item { display: grid; grid-template-columns: minmax(0, 1fr); column-gap: var(--rf-space-150); row-gap: var(--rf-space-050); padding-block: var(--rf-space-150); }
  .mc-hc__item + .mc-hc__item { border-top: 1px solid var(--rf-border); }
  .mc-hc__head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 0 var(--rf-space-150); }
  .mc-hc__head > span { font-variant-numeric: tabular-nums; }
  .mc-hc__tip { margin-top: var(--rf-space-050); padding: var(--rf-space-075) var(--rf-space-100); border-radius: var(--rf-radius-small); background: var(--rf-surface-sunken); font: var(--rf-font-body-small); }
  .mc-grade-row { display: inline-flex; align-items: center; gap: var(--rf-space-100); }
  .mc-grade { display: inline-flex; }
  .mc-grade .rfd-lozenge { min-inline-size: 2.5rem; justify-content: center; text-align: center; }
  /* S = ป้ายเหลืองแบบเดียวกับเกรดอื่น (DS warning) + เรืองแสงทองเบา ๆ ให้รู้ว่าพิเศษ */
