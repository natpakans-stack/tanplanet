<!doctype html>
<meta charset="utf-8" />
<style>
  /* Anuphan variable (wght 100–700) — ไฟล์เดียวครอบทุกน้ำหนัก */
  @font-face {
    font-family: 'Anuphan'; font-style: normal; font-weight: 100 700; font-display: swap;
    src: url(fonts/anuphan-thai.woff2) format('woff2');
    unicode-range: U+02D7, U+0303, U+0331, U+0E01-0E5B, U+200C-200D, U+25CC;
  }
  @font-face {
    font-family: 'Anuphan'; font-style: normal; font-weight: 100 700; font-display: swap;
    src: url(fonts/anuphan-latin.woff2) format('woff2');
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC,
      U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
  }

  :root {
    color-scheme: light dark;
    --bg: #ffffff;
    --surface: #f7f6f5;
    --border: #e7e5e4;
    --text: #1c1917;
    --muted: #6f6763;
    --accent: #c0102a;
    --accent-fg: #ffffff;
    --chip-master: #15803d;
    --chip-variant: #92610b;
    --chip-file: #1d4ed8;
    --r: 8px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1917;
      --surface: #262220;
      --border: #3b3633;
      --text: #f5f5f4;
      --muted: #a8a29d;
      --accent: #f0455f;
      --accent-fg: #23100f;
      --chip-master: #7ee2a8;
      --chip-variant: #f4c757;
      --chip-file: #9dbcff;
    }
  }

  body {
    width: 420px;
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 13px/1.5 'Anuphan', -apple-system, system-ui, sans-serif;
  }

  /* ---- buttons ---- */
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font: inherit;
    font-size: 12px;
    line-height: 1;
    color: var(--text);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0 10px;
    height: 26px;
    cursor: pointer;
    white-space: nowrap;
  }
  .i { width: 14px; height: 14px; flex-shrink: 0; }
  .info .i { width: 13px; height: 13px; vertical-align: -2px; margin-right: 2px; }
  .btn:hover { background: var(--surface); }
  .btn:active { transform: translateY(0.5px); }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .btn.primary {
    background: var(--accent);
    border-color: transparent;
    color: var(--accent-fg);
    font-weight: 600;
  }
  .btn.primary:hover { filter: brightness(1.08); }
  /* secondary download — primary มีได้ตัวเดียวต่อการ์ด ไม่งั้นแดงตีกันหมดจอ */
  .btn.dl {
    color: var(--accent);
    font-weight: 600;
    border-color: color-mix(in srgb, var(--accent) 35%, var(--border));
  }
  .btn.dl:hover { background: color-mix(in srgb, var(--accent) 8%, var(--bg)); }
  .btn.ok { color: var(--chip-master); border-color: currentColor; background: var(--bg); }
  .btn.primary.ok { background: var(--bg); }

  /* ---- header ---- */
  header {
    position: sticky;
    top: 0;
    z-index: 1;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px 10px;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
  }
  header .spacer { flex: 1; }

  /* ---- target: โปรเจกต์/ซีนใน ShotDeck ---- */
  .target { display: flex; gap: 6px; padding: 8px 10px; background: var(--surface); border-bottom: 1px solid var(--border); }
  /* custom dropdown — <select> บน macOS เป็น popup ของระบบ แต่งไม่ได้ (แพตเทิร์นเดียวกับแผงข้าง ShotDeck) */
  .dd { position: relative; flex: 1; min-width: 0; }
  .dd > button {
    width: 100%; height: 28px; display: flex; align-items: center; gap: 6px; padding: 0 6px 0 8px;
    font: inherit; font-size: 12px; color: var(--text); text-align: left;
    background: var(--bg); border: 1px solid var(--border); border-radius: 6px; cursor: pointer;
  }
  .dd > button:hover { border-color: color-mix(in srgb, var(--accent) 35%, var(--border)); }
  .dd > button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .dd > button .val { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dd > button .i { color: var(--muted); transition: transform .15s; }
  .dd[data-open] > button .i { transform: rotate(180deg); }
  .dd ul {
    display: none; position: absolute; z-index: 3; inset-inline: 0; top: calc(100% + 4px);
    margin: 0; padding: 4px; list-style: none; max-height: 260px; overflow: auto;
    background: var(--bg); border: 1px solid var(--border); border-radius: var(--r);
    box-shadow: 0 10px 28px rgba(0, 0, 0, .18);
  }
  #shot ul { inset-inline: auto 0; width: 380px; } /* ซีนยาว — ให้แผ่กว้างกว่าปุ่ม ชิดขวา */
  .dd[data-open] ul { display: block; }
  .dd li button {
    width: 100%; display: flex; align-items: center; gap: 6px; padding: 7px 8px; min-height: 32px;
    font: inherit; font-size: 12px; color: var(--text); text-align: left;
    background: none; border: 0; border-radius: 5px; cursor: pointer;
  }
  .dd li button:hover, .dd li button:focus-visible { background: var(--surface); outline: none; }
  .dd li button span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dd li button .i { color: var(--chip-master); visibility: hidden; }
  .dd li button[aria-selected="true"] .i { visibility: visible; }
  .dd li button small { color: var(--muted); }
  @media (prefers-reduced-motion: reduce) { .dd > button .i { transition: none; } }
  /* ป๊อปอัปสูงเท่าเนื้อหา — รายการที่แผ่ลงมาจะโดนตัดถ้าไม่ดันพื้นให้สูงพอ */
  body:has(.dd[data-open]) { min-height: 340px; }
  .target .mp3 { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; white-space: nowrap; cursor: pointer; }
  .target .mp3 input { accent-color: var(--accent); margin: 0; }
  /* วางลิงก์เอง — ไม่ต้องรอ sniff ทุกหน้า */
  .paste { display: flex; gap: 6px; padding: 8px 10px; border-bottom: 1px solid var(--border); }
  .paste input {
    flex: 1; min-width: 0; height: 28px; padding: 0 8px;
    font: inherit; font-size: 12px; color: var(--text);
    background: var(--bg); border: 1px solid var(--border); border-radius: 6px;
  }
  .paste input::placeholder { color: var(--muted); }
  .paste input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .paste .btn { height: 28px; }
  .thumb { width: 64px; height: 36px; flex-shrink: 0; object-fit: cover; border-radius: 4px; background: #000; }

  /* ---- youtube card ---- */
  .yt {
    margin: 10px;
    padding: 10px 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 3px solid var(--accent);
    border-radius: var(--r);
  }
  .yt-head { font-weight: 600; display: flex; align-items: baseline; gap: 6px; }
  .yt-mark { color: var(--accent); }
  .yt-sub { color: var(--muted); font-size: 12px; font-weight: 400; }
  .u {
    margin: 4px 0 9px;
    color: var(--muted);
    font-size: 11px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .acts { display: flex; gap: 6px; flex-shrink: 0; }

  /* ---- media rows ---- */
  .row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 12px;
    border-top: 1px solid var(--border);
  }
  .row:hover { background: var(--surface); }
  .row-main { flex: 1; min-width: 0; }
  .row-top { display: flex; align-items: baseline; gap: 8px; }
  .chip {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: .04em;
    text-transform: uppercase;
    color: var(--chip-file);
  }
  .chip.master { color: var(--chip-master); }
  .chip.variant { color: var(--chip-variant); }
  .q { font-weight: 600; font-variant-numeric: tabular-nums; }
  .info {
    color: var(--muted);
    font-size: 12px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .empty { padding: 28px 16px; color: var(--muted); text-align: center; }
  .empty b { display: block; color: var(--text); margin-bottom: 3px; }

  /* ---- status bar ---- */
  .status {
    position: sticky;
    bottom: 0;
    padding: 0 12px;
    max-height: 0;
    overflow: hidden;
    font-size: 12px;
    line-height: 1.45;
    white-space: pre-line; /* ข้อความ error ขึ้นบรรทัดใหม่ได้ */
    color: var(--muted);
    background: var(--surface);
    border-top: 1px solid transparent;
    transition: max-height .15s ease;
  }
  .status.show { max-height: 80px; padding: 7px 12px; border-top-color: var(--border); }
  .status.ok { color: var(--chip-master); }
  .status.err { color: var(--accent); }
  @media (prefers-reduced-motion: reduce) { .status { transition: none; } }
</style>
<header>
  <button class="btn" id="rescan" title="โหลดหน้าใหม่แล้วดักซ้ำ">Rescan</button>
  <button class="btn" id="copyAll">Copy all</button>
  <span class="spacer"></span>
  <button class="btn" id="clear" title="ล้างรายการของแท็บนี้">Clear</button>
</header>
<div class="target">
  <div class="dd" id="proj" data-label="โปรเจกต์ ShotDeck"></div>
  <div class="dd" id="shot" data-label="ซีนที่จะใส่ฟุตเทจ" hidden></div>
  <label class="mp3" title="เอาเสียงอย่างเดียว (mp3) — ใน ShotDeck เข้าช่อง sfx ของซีน"><input type="checkbox" id="mp3"> MP3</label>
</div>
<form class="paste" id="paste">
  <input type="url" id="pasteUrl" placeholder="วางลิงก์คลิป (YouTube / TikTok / Pinterest / IG …) แล้ว Enter" aria-label="ลิงก์คลิป" required>
  <button type="submit" class="btn dl" id="pasteGo"></button>
</form>
<div id="wrap"></div>
<div class="status" id="status" role="status" aria-live="polite"></div>
<script src="icons.js"></script>
<script src="popup.js"></script>
