<!doctype html>
<html lang="th"><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FFFCF5; --card:#FFFFFF; --ink:#1F2328; --muted:#8A9099;
    --line:#ECE3D2; --accent:#F2B705; --accent-soft:#FEF6E0;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:2500px;height:1686px;background:var(--bg);
       font-family:"IBM Plex Sans Thai",system-ui,sans-serif;overflow:hidden}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);
        width:100%;height:100%;gap:3px;background:var(--line)}
  .tile{background:var(--card);display:flex;flex-direction:column;
        align-items:center;justify-content:center;position:relative;padding-bottom:8px}
    .ico{width:280px;height:280px;border-radius:78px;background:var(--accent-soft);
       display:flex;align-items:center;justify-content:center}
  .ico svg{width:140px;height:140px;stroke:var(--ink);stroke-width:1.5}
  .ico{margin-bottom:60px}
  .txt{text-align:center}
    .lb{font-size:88px;font-weight:600;color:var(--ink);letter-spacing:-0.5px;line-height:1.15}
    .sub{font-size:56px;font-weight:400;color:var(--muted);line-height:1.3;margin-top:16px}
  .tile.lead .ico{background:var(--accent)}
</style></head><body>
<div class="grid">
  <div class="tile lead"><div class="ico" data-i="receipt-text"></div><div class="txt"><div class="lb">สร้างบิล</div><div class="sub">กรอกฟอร์ม ตั้งเวลา</div></div></div>
  <div class="tile"><div class="ico" data-i="bell-ring"></div><div class="txt"><div class="lb">บิลที่รออยู่</div><div class="sub">ยังไม่ถึงเวลา</div></div></div>
  <div class="tile"><div class="ico" data-i="gauge"></div><div class="txt"><div class="lb">เครดิตเดือนนี้</div><div class="sub">เหลือกี่ข้อความ</div></div></div>
  <div class="tile"><div class="ico" data-i="send"></div><div class="txt"><div class="lb">สถิติการส่ง</div><div class="sub">ยิงไปไหนบ้าง</div></div></div>
  <div class="tile"><div class="ico" data-i="table-2"></div><div class="txt"><div class="lb">เปิดชีต</div><div class="sub">แก้/ดูทั้งหมด</div></div></div>
  <div class="tile"><div class="ico" data-i="circle-help"></div><div class="txt"><div class="lb">วิธีใช้</div><div class="sub">คำสั่งทั้งหมด</div></div></div>
</div>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<script>
  document.querySelectorAll('.ico').forEach(function (el) {
    var i = document.createElement('i');
    i.setAttribute('data-lucide', el.dataset.i);
    el.appendChild(i);
  });
  lucide.createIcons();
  document.body.dataset.ready = '1';
</script>
</body></html>
