name: MegaCoach Telegram alerts (เดิม LINE)

# ส่งข้อความเข้า Telegram ทุกครั้งที่ line-outbox.json เปลี่ยน (cloud routine push เข้ามา)
# token อยู่ใน repo secret TELEGRAM_BOT_TOKEN + TELEGRAM_CHAT_ID — sandbox คลาวด์ของ routine
# ยิง API ภายนอกตรงไม่ได้ (network egress ถูกบล็อก) จึงให้ Action เป็นคนส่งแทน
on:
  push:
    branches: [main]
    paths:
      - 'megacoach/liff-app/line-outbox.json'
  workflow_dispatch:

jobs:
  broadcast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # เจอก้อนบรีฟเช้า → ต่อการ์ด "ดวงลงทุนวันนี้" (สดจาก API) เป็น carousel [brief, ดวง]
      # การ์ดอื่น (alert/DCA) ไม่แตะ · API ล่ม → ส่งบรีฟเดี่ยวตามเดิม
      - name: Attach ดวงลงทุน card (carousel)
        run: |
          cat > /tmp/attach.mjs <<'SCRIPT'
          import { readFileSync, writeFileSync } from "node:fs";
          const PATH = "megacoach/liff-app/line-outbox.json";
          const API = "https://thai-astrology-flame.vercel.app/daily-invest/flex";
          const isBrief = m => m?.type==="flex" && m.contents?.type==="bubble"
            && /ENTRY SIGNAL|บรีฟเช้า/.test(JSON.stringify(m.contents.header||{}));
          const outbox = JSON.parse(readFileSync(PATH,"utf8"));
          let changed=false;
          for (const m of outbox.messages||[]) {
            if (!isBrief(m)) continue;
            try {
              const astro = await (await fetch(API)).json();
              if (astro?.type !== "bubble") throw new Error("bad astro bubble");
              m.contents = { type:"carousel", contents:[m.contents, astro] };
              m.altText = (m.altText||"บรีฟเช้า MegaCoach") + " + 🔮 ดวงลงทุนวันนี้";
              changed = true; console.log("✅ ต่อการ์ดดวง → carousel");
            } catch (e) { console.log("⚠️ ดึงการ์ดดวงไม่ได้ ส่งบรีฟเดี่ยว:", e.message); }
          }
          if (changed) writeFileSync(PATH, JSON.stringify(outbox,null,2)+"\n");
          else console.log("ไม่พบก้อนบรีฟเช้า — outbox คงเดิม");
          SCRIPT
          node /tmp/attach.mjs

      # ต่อการ์ด "คัดหุ้นวันนี้" ท้าย carousel (จาก screen-data.json ที่ box เขียนตอน 05:30)
      # ข้อมูลเก่าเกิน 4 วัน/ไม่มีบรีฟเช้า → ข้าม · พังก็ไม่ขวางการส่งบรีฟ
      - name: Attach คัดหุ้นวันนี้ card
        run: node megacoach/liff-app/screen-card.mjs || echo "⚠️ ต่อการ์ดคัดหุ้นไม่ได้ ส่งเท่าเดิม"

      # รวม "คุ้มทุน" เข้าแถวหุ้นที่ถือ (1 หุ้น = 1 บรรทัด) · พังก็ไม่ขวางการส่ง
      - name: Fold breakeven into holdings rows
        run: node megacoach/liff-app/brief-be.mjs || echo "⚠️ รวมคุ้มทุนไม่ได้ ส่งเท่าเดิม"

      - name: Validate outbox JSON
        run: jq -e '.messages | type == "array" and length > 0' megacoach/liff-app/line-outbox.json

      - name: Send to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # runner ไม่มี IPv6 + happy-eyeballs ของ Node ตัด IPv4 เร็วเกิน → ETIMEDOUT
          NODE_OPTIONS: --dns-result-order=ipv4first --no-network-family-autoselection
        run: node megacoach/telegram.mjs megacoach/liff-app/line-outbox.json
