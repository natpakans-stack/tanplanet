<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TanPlanet Device Mock UI</title>
  <style>
    :root {
      --bg: #10121e;
      --panel: #182039;
      --panel-strong: #202946;
      --ink: #f6f3ea;
      --muted: #a7aec5;
      --ok: #20c997;
      --neutral: #7aa2ff;
      --caution: #f9c74f;
      --danger: #ff6b6b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: radial-gradient(circle at top, #29304d, var(--bg));
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    /* จอจริง 480x320 landscape — scale 1.5x เพื่อดูบนจอคอม */
    .device {
      width: 720px;
      max-width: 100%;
      aspect-ratio: 3 / 2;
      background: #05070d;
      border: 12px solid #111;
      border-radius: 18px;
      padding: 10px;
      box-shadow: 0 24px 80px rgba(0,0,0,.4);
      overflow: hidden;
    }
    .screen {
      position: relative;
      height: 100%;
      background: #0b1020;
      border-radius: 6px;
      padding: 12px 14px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .statusbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }
    .statusbar .wifi { color: var(--ok); }
    .hero {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 2px 4px;
    }
    /* ตัวเลขใหญ่ = TFT_eSPI Font 8 (75px, ตัวเลข/โคลอนเท่านั้น) */
    .clock {
      font-size: 68px;
      font-weight: 900;
      font-variant-numeric: tabular-nums;
      letter-spacing: 2px;
      line-height: 1;
    }
    .clock .sec { font-size: 26px; color: var(--muted); font-weight: 800; }
    .heroRight { text-align: right; }
    .heroDate { font-size: 20px; font-weight: 800; }
    .heroLunar { color: var(--muted); font-size: 13px; margin-top: 4px; }
    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      flex: 1;
    }
    .card {
      appearance: none;
      color: inherit;
      font: inherit;
      text-align: left;
      min-height: 64px;
      background: var(--panel);
      border: 1px solid rgba(255,255,255,.08);
      border-left: 4px solid var(--neutral);
      border-radius: 8px;
      padding: 8px 10px;
      overflow: hidden;
      cursor: pointer;
      transition: transform .16s ease, border-color .16s ease, background .16s ease;
      width: 100%;
    }
    .card:hover,
    .card:focus-visible {
      background: var(--panel-strong);
      border-color: rgba(255,255,255,.22);
      outline: none;
      transform: translateY(-1px);
    }
    .card:active { transform: translateY(0); }
    .card.ok { border-left-color: var(--ok); }
    .card.neutral { border-left-color: var(--neutral); }
    .card.caution { border-left-color: var(--caution); }
    .card.danger { border-left-color: var(--danger); }
    .title {
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      margin-bottom: 3px;
      text-transform: uppercase;
      letter-spacing: .4px;
    }
    .value {
      font-size: 19px;
      font-weight: 800;
      line-height: 1.1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .detail {
      margin-top: 4px;
      color: #d5d9e8;
      font-size: 11px;
      line-height: 1.25;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .error { color: var(--danger); font-size: 13px; }
    .controls {
      display: grid;
      grid-template-columns: 44px 1fr 44px;
      align-items: center;
      gap: 8px;
    }
    .nav {
      appearance: none;
      border: 1px solid rgba(255,255,255,.12);
      background: #111a30;
      color: var(--ink);
      height: 32px;
      border-radius: 8px;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
    }
    .nav:disabled { opacity: .35; cursor: default; }
    .page { color: var(--muted); font-size: 11px; text-align: center; }
    .detailView {
      position: absolute;
      inset: 10px;
      background: linear-gradient(180deg, #151d35, #0b1020);
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 8px;
      padding: 12px 14px;
      display: none;
    }
    .detailView.open {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .detailTop {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
    }
    .back {
      appearance: none;
      border: 1px solid rgba(255,255,255,.14);
      background: #111a30;
      color: var(--ink);
      height: 34px;
      border-radius: 8px;
      padding: 0 14px;
      font: inherit;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
    }
    .pill {
      border-radius: 999px;
      padding: 5px 9px;
      background: rgba(255,255,255,.08);
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
    }
    .detailTitle { color: var(--muted); font-size: 13px; font-weight: 800; }
    .detailValue { font-size: 26px; font-weight: 900; line-height: 1.1; }
    .detailText {
      color: #d5d9e8;
      font-size: 14px;
      line-height: 1.45;
      overflow: auto;
      padding-right: 4px;
      flex: 1;
    }
    /* Shared viz — ทุกอย่างเป็น rect/line/arc ที่ LVGL วาดได้ */
    .viz { display: flex; flex-direction: column; gap: 7px; margin-top: 6px; }
    .vRow {
      display: grid;
      grid-template-columns: 128px 1fr 44px;
      gap: 8px;
      align-items: center;
      font-size: 12px;
    }
    .vName { font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .vSub { color: var(--muted); font-size: 10px; font-weight: 700; }
    .vTrack { height: 14px; background: rgba(255,255,255,.06); border-radius: 4px; position: relative; overflow: hidden; }
    .vFill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 4px; background: var(--neutral); }
    .vVal { text-align: right; font-weight: 800; font-variant-numeric: tabular-nums; }
    .stRow {
      display: grid;
      grid-template-columns: 118px 1fr 52px 62px;
      gap: 8px;
      align-items: center;
      font-size: 12px;
    }
    .divTrack { height: 14px; background: rgba(255,255,255,.06); border-radius: 4px; position: relative; overflow: hidden; }
    .divTrack::before { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 1px; background: rgba(255,255,255,.25); }
    .divFill { position: absolute; top: 0; bottom: 0; border-radius: 4px; }
    .sigChip { font-size: 10px; font-weight: 800; border-radius: 999px; padding: 3px 0; text-align: center; }
    .sig-go { background: rgba(32,201,151,.18); color: var(--ok); }
    .sig-wait { background: rgba(249,199,79,.18); color: var(--caution); }
    .sig-avoid { background: rgba(255,107,107,.18); color: var(--danger); }
    .sig-hold { background: rgba(122,162,255,.18); color: var(--neutral); }
    .noteText { color: #a7aec5; font-size: 12px; line-height: 1.45; margin-top: 10px; }
    .vizSvg { width: 100%; height: auto; display: block; margin-top: 6px; }
    /* Weather graph */
    .wxGraph { width: 100%; height: auto; display: block; margin-top: 4px; }
    .wxChips {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-top: 8px;
    }
    .wxChip {
      background: var(--panel);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 8px;
      padding: 8px 6px;
      text-align: center;
    }
    .wxChip .d { color: var(--muted); font-size: 11px; font-weight: 800; }
    .wxChip .e { font-size: 20px; margin: 3px 0; }
    .wxChip .hi { font-size: 14px; font-weight: 800; }
    .wxChip .lo { color: var(--muted); font-size: 11px; }
    /* Calendar month grid */
    .calGrid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 3px;
      margin-top: 4px;
    }
    .calGrid .h {
      color: var(--muted);
      font-size: 10px;
      font-weight: 800;
      text-align: center;
      padding: 2px 0;
    }
    .calGrid .h.sun { color: var(--danger); }
    .calGrid .d {
      position: relative;
      text-align: center;
      font-size: 13px;
      font-weight: 700;
      padding: 4px 0 8px;
      border-radius: 6px;
      background: rgba(255,255,255,.03);
    }
    .calGrid .d.today {
      background: var(--neutral);
      color: #0b1020;
      font-weight: 900;
    }
    .calGrid .d.buddha::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: 3px;
      transform: translateX(-50%);
      width: 5px; height: 5px;
      border-radius: 999px;
      background: var(--caution);
    }
    .calGrid .d.holiday { color: var(--danger); }
    .calLegend {
      display: flex;
      gap: 14px;
      color: var(--muted);
      font-size: 11px;
      margin-top: 8px;
    }
    .calLegend .dot {
      display: inline-block;
      width: 7px; height: 7px;
      border-radius: 999px;
      background: var(--caution);
      margin-right: 4px;
    }
  </style>
</head>
<body>
  <main class="device">
    <section class="screen">
      <div class="statusbar">
        <div>TanPlanet</div>
        <div><span class="wifi">Wi-Fi ●</span> <span id="sync">loading</span></div>
      </div>
      <div class="hero">
        <div class="clock" id="clock">--:--<span class="sec"></span></div>
        <div class="heroRight">
          <div class="heroDate" id="heroDate">-</div>
          <div class="heroLunar" id="heroLunar">-</div>
        </div>
      </div>
      <div class="grid" id="cards"></div>
      <div class="controls">
        <button class="nav" id="prev" type="button">‹</button>
        <div class="page" id="page">0 / 0</div>
        <button class="nav" id="next" type="button">›</button>
      </div>
      <div class="error" id="error"></div>
      <section class="detailView" id="detailView" aria-live="polite">
        <div class="detailTop">
          <button class="back" id="back" type="button">Back</button>
          <div class="pill" id="detailTone">neutral</div>
        </div>
        <div class="detailTitle" id="detailTitle"></div>
        <div class="detailValue" id="detailValue"></div>
        <div class="detailText" id="detailText"></div>
      </section>
    </section>
  </main>
  <script>
    const endpoint = location.protocol === "file:" ? "http://localhost:8787/api/device-summary" : "/api/device-summary";
    const cardsEl = document.getElementById("cards");
    const syncEl = document.getElementById("sync");
    const errorEl = document.getElementById("error");
    const prevEl = document.getElementById("prev");
    const nextEl = document.getElementById("next");
    const pageEl = document.getElementById("page");
    const clockEl = document.getElementById("clock");
    const heroDateEl = document.getElementById("heroDate");
    const heroLunarEl = document.getElementById("heroLunar");
    const detailViewEl = document.getElementById("detailView");
    const detailToneEl = document.getElementById("detailTone");
    const detailTitleEl = document.getElementById("detailTitle");
    const detailValueEl = document.getElementById("detailValue");
    const detailTextEl = document.getElementById("detailText");
    const backEl = document.getElementById("back");
    const pageSize = 4;
    let cards = [];
    let page = 0;

    function tickClock() {
      const now = new Date();
      const hh = String(now.getHours()).padStart(2, "0");
      const mm = String(now.getMinutes()).padStart(2, "0");
      const ss = String(now.getSeconds()).padStart(2, "0");
      clockEl.innerHTML = `${hh}:${mm}<span class="sec">:${ss}</span>`;
    }
    tickClock();
    setInterval(tickClock, 1000);

    function render(data) {
      syncEl.textContent = data.updatedAt ? `sync ${new Date(data.updatedAt).toLocaleTimeString("th-TH")}` : "mock";
      const all = data.cards || [];
      const calendarCard = all.find((c) => c.id === "calendar_today");
      const lunarCard = all.find((c) => c.id === "lunar_today");
      heroDateEl.textContent = calendarCard?.value || "-";
      heroLunarEl.textContent = lunarCard?.value || "";
      cards = all.filter((c) => c.id !== "home_clock");
      page = 0;
      renderPage();
    }

    function renderPage() {
      const totalPages = Math.max(1, Math.ceil(cards.length / pageSize));
      page = Math.min(Math.max(page, 0), totalPages - 1);
      const start = page * pageSize;
      const pageCards = cards.slice(start, start + pageSize);

      cardsEl.innerHTML = "";
      for (const card of pageCards) {
        const el = document.createElement("button");
        el.type = "button";
        el.className = `card ${card.tone || "neutral"}`;
        el.innerHTML = `
          <div class="title"></div>
          <div class="value"></div>
          <div class="detail"></div>
        `;
        el.querySelector(".title").textContent = card.title || card.id || "-";
        el.querySelector(".value").textContent = card.value || "-";
        el.querySelector(".detail").textContent = card.detail || "";
        el.addEventListener("click", () => showDetail(card));
        cardsEl.appendChild(el);
      }

      pageEl.textContent = `${start + 1}-${Math.min(start + pageSize, cards.length)} / ${cards.length}`;
      prevEl.disabled = page === 0;
      nextEl.disabled = page >= totalPages - 1;
    }

    function renderWeatherDetail(extra) {
      const wrap = document.createElement("div");
      const hourly = extra.hourly || [];
      if (hourly.length) {
        const w = 440, h = 100, pad = 18;
        const vals = hourly.map((p) => p.v);
        const min = Math.min(...vals), max = Math.max(...vals);
        const x = (i) => pad + (i * (w - pad * 2)) / (hourly.length - 1);
        const y = (v) => h - 24 - ((v - min) * (h - 46)) / Math.max(1, max - min);
        const points = hourly.map((p, i) => `${x(i)},${y(p.v)}`).join(" ");
        const dots = hourly.map((p, i) =>
          `<circle cx="${x(i)}" cy="${y(p.v)}" r="3" fill="#7aa2ff"/>
           <text x="${x(i)}" y="${y(p.v) - 8}" text-anchor="middle" font-size="10" fill="#f6f3ea" font-weight="700">${p.v}°</text>
           <text x="${x(i)}" y="${h - 6}" text-anchor="middle" font-size="9" fill="#a7aec5">${p.t}</text>`
        ).join("");
        wrap.innerHTML = `
          <svg class="wxGraph" viewBox="0 0 ${w} ${h}" role="img" aria-label="กราฟอุณหภูมิรายชั่วโมง">
            <polyline points="${points}" fill="none" stroke="#7aa2ff" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
            ${dots}
          </svg>`;
      }
      const chips = document.createElement("div");
      chips.className = "wxChips";
      for (const f of extra.forecast || []) {
        const chip = document.createElement("div");
        chip.className = "wxChip";
        chip.innerHTML = `<div class="d"></div><div class="e"></div><div class="hi"></div><div class="lo"></div>`;
        chip.querySelector(".d").textContent = f.d;
        chip.querySelector(".e").textContent = f.e;
        chip.querySelector(".hi").textContent = `${f.hi}°`;
        chip.querySelector(".lo").textContent = `${f.lo}°`;
        chips.appendChild(chip);
      }
      wrap.appendChild(chips);
      return wrap;
    }

    function renderCalendarDetail(cal) {
      const wrap = document.createElement("div");
      const grid = document.createElement("div");
      grid.className = "calGrid";
      const headers = ["อา", "จ", "อ", "พ", "พฤ", "ศ", "ส"];
      headers.forEach((name, i) => {
        const el = document.createElement("div");
        el.className = `h${i === 0 ? " sun" : ""}`;
        el.textContent = name;
        grid.appendChild(el);
      });
      const first = new Date(cal.y, cal.m - 1, 1);
      const daysInMonth = new Date(cal.y, cal.m, 0).getDate();
      for (let i = 0; i < first.getDay(); i++) grid.appendChild(document.createElement("div"));
      const holidayDays = (cal.holidays || []).map((holiday) => holiday.d);
      for (let day = 1; day <= daysInMonth; day++) {
        const el = document.createElement("div");
        const classes = ["d"];
        if (day === cal.today) classes.push("today");
        if ((cal.buddhaDays || []).includes(day)) classes.push("buddha");
        if (holidayDays.includes(day) || new Date(cal.y, cal.m - 1, day).getDay() === 0) classes.push("holiday");
        el.className = classes.join(" ");
        el.textContent = day;
        grid.appendChild(el);
      }
      const legend = document.createElement("div");
      legend.className = "calLegend";
      legend.innerHTML = `<span><span class="dot"></span>วันพระ</span><span style="color:var(--danger)">● วันหยุด/อาทิตย์</span>`;
      wrap.appendChild(grid);
      wrap.appendChild(legend);
      return wrap;
    }

    function noteEl(text) {
      const el = document.createElement("div");
      el.className = "noteText";
      el.textContent = text;
      return el;
    }

    // Idea Radar: bar chart คะแนนธีม (rect ล้วน — LVGL lv_bar ได้)
    function renderThemesDetail(extra) {
      const wrap = document.createElement("div");
      wrap.className = "viz";
      const max = Math.max(...extra.themes.map((t) => t.score), 1);
      for (const t of extra.themes) {
        const row = document.createElement("div");
        row.className = "vRow";
        row.innerHTML = `<div><div class="vName"></div><div class="vSub"></div></div><div class="vTrack"><div class="vFill"></div></div><div class="vVal"></div>`;
        row.querySelector(".vName").textContent = t.name;
        row.querySelector(".vSub").textContent = t.stage;
        row.querySelector(".vFill").style.width = `${(t.score / max) * 100}%`;
        row.querySelector(".vVal").textContent = t.score;
        wrap.appendChild(row);
      }
      if (extra.note) wrap.appendChild(noteEl(extra.note));
      return wrap;
    }

    // Live intraday chart — poll /api/price ทุก 60 วิ (ESP32 ทำแบบเดียวกันด้วย lv_chart streaming)
    let liveTimer = null;
    function stopLiveChart() {
      if (liveTimer) { clearInterval(liveTimer); liveTimer = null; }
    }

    function drawLiveChart(container, data) {
      const w = 440, h = 110, pad = 34;
      const vals = data.points.map((p) => p.v).concat(data.prevClose ? [data.prevClose] : []);
      const min = Math.min(...vals), max = Math.max(...vals);
      const x = (i) => pad + (i * (w - pad - 8)) / Math.max(1, data.points.length - 1);
      const y = (v) => 14 + ((max - v) * (h - 34)) / Math.max(0.01, max - min);
      const pts = data.points.map((p, i) => `${x(i)},${y(p.v)}`).join(" ");
      const up = data.current >= data.prevClose;
      const color = up ? "#20c997" : "#ff6b6b";
      const chg = data.prevClose ? (((data.current - data.prevClose) / data.prevClose) * 100).toFixed(2) : "0";
      const timeLabel = (t) => new Date(t * 1000).toLocaleTimeString("th-TH", { hour: "2-digit", minute: "2-digit" });
      const first = data.points[0], last = data.points[data.points.length - 1];
      container.innerHTML = `
        <svg class="vizSvg" viewBox="0 0 ${w} ${h}" role="img" aria-label="กราฟราคา ${data.ticker}">
          ${data.prevClose ? `<line x1="${pad}" y1="${y(data.prevClose)}" x2="${w - 8}" y2="${y(data.prevClose)}" stroke="rgba(255,255,255,.25)" stroke-width="1" stroke-dasharray="4 4"/>
          <text x="${pad - 4}" y="${y(data.prevClose) + 3}" text-anchor="end" font-size="9" fill="#a7aec5">${data.prevClose.toFixed(0)}</text>` : ""}
          <polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
          ${last ? `<circle cx="${x(data.points.length - 1)}" cy="${y(last.v)}" r="3.5" fill="${color}"/>` : ""}
          <text x="${w - 8}" y="12" text-anchor="end" font-size="13" fill="${color}" font-weight="900">$${Number(data.current).toFixed(2)} (${chg > 0 ? "+" : ""}${chg}%)</text>
          ${first ? `<text x="${pad}" y="${h - 4}" font-size="9" fill="#a7aec5">${timeLabel(first.t)}</text>` : ""}
          ${last ? `<text x="${w - 8}" y="${h - 4}" text-anchor="end" font-size="9" fill="#a7aec5">${timeLabel(last.t)} · LIVE ทุก 60 วิ</text>` : ""}
        </svg>`;
    }

    async function startLiveChart(container, ticker) {
      stopLiveChart();
      container.innerHTML = `<div class="noteText">กำลังโหลดกราฟ ${ticker}…</div>`;
      const load = async () => {
        try {
          const response = await fetch(`/api/price?ticker=${ticker}`);
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          drawLiveChart(container, await response.json());
        } catch (error) {
          container.innerHTML = `<div class="noteText">โหลดราคาสด ${ticker} ไม่ได้ (${error.message}) — จอจริงจะแสดง cache ล่าสุดแทน</div>`;
        }
      };
      await load();
      liveTimer = setInterval(load, 60_000);
    }

    // Market: กราฟสด + diverging bar % เปลี่ยนแปลง + signal chip (กดแถวเพื่อสลับกราฟ)
    function renderStocksDetail(extra) {
      const wrap = document.createElement("div");
      wrap.className = "viz";
      const chart = document.createElement("div");
      wrap.appendChild(chart);
      const shown = extra.stocks.slice(0, 4); // 4 แถว + กราฟ = พอดีจอ 320px สูง
      const maxAbs = Math.max(...shown.map((s) => Math.abs(s.change)), 1);
      for (const s of shown) {
        const row = document.createElement("div");
        row.className = "stRow";
        row.style.cursor = "pointer";
        row.innerHTML = `<div><span class="vName"></span> <span class="vSub"></span></div><div class="divTrack"><div class="divFill"></div></div><div class="vVal"></div><div class="sigChip"></div>`;
        row.querySelector(".vName").textContent = s.ticker;
        row.querySelector(".vSub").textContent = s.price || "";
        const fill = row.querySelector(".divFill");
        const half = (Math.abs(s.change) / maxAbs) * 50;
        fill.style.background = s.change >= 0 ? "var(--ok)" : "var(--danger)";
        fill.style[s.change >= 0 ? "left" : "right"] = "50%";
        fill.style.width = `${half}%`;
        const val = row.querySelector(".vVal");
        val.textContent = `${s.change > 0 ? "+" : ""}${s.change.toFixed(1)}%`;
        val.style.color = s.change >= 0 ? "var(--ok)" : "var(--danger)";
        const chip = row.querySelector(".sigChip");
        chip.classList.add(`sig-${s.signal || "hold"}`);
        chip.textContent = { go: "GO", wait: "WAIT", avoid: "AVOID", hold: "HOLD" }[s.signal] || "-";
        row.addEventListener("click", () => startLiveChart(chart, s.ticker));
        wrap.appendChild(row);
      }
      if (extra.stocks.length) startLiveChart(chart, extra.stocks[0].ticker);
      return wrap;
    }

    // Monthly Plan: price ladder stop → entry band → target (line+rect+จุด)
    function renderLadderDetail(ladder) {
      const wrap = document.createElement("div");
      const w = 440, h = 96, pad = 48;
      const lo = ladder.stop, hi = ladder.target;
      const x = (v) => pad + ((v - lo) * (w - pad * 2)) / Math.max(1, hi - lo);
      const bandX = x(ladder.entryLo), bandW = Math.max(4, x(ladder.entryHi) - x(ladder.entryLo));
      const cur = ladder.current;
      wrap.innerHTML = `
        <svg class="vizSvg" viewBox="0 0 ${w} ${h}" role="img" aria-label="แผนราคา ${ladder.ticker}">
          <line x1="${pad}" y1="52" x2="${w - pad}" y2="52" stroke="rgba(255,255,255,.18)" stroke-width="2"/>
          <rect x="${bandX}" y="42" width="${bandW}" height="20" rx="4" fill="rgba(122,162,255,.30)"/>
          <text x="${(bandX + bandX + bandW) / 2}" y="34" text-anchor="middle" font-size="10" fill="#a7aec5" font-weight="700">entry $${ladder.entryLo}–${ladder.entryHi}</text>
          <line x1="${x(ladder.stop)}" y1="40" x2="${x(ladder.stop)}" y2="64" stroke="#ff6b6b" stroke-width="3"/>
          <text x="${x(ladder.stop)}" y="82" text-anchor="middle" font-size="11" fill="#ff6b6b" font-weight="800">stop $${ladder.stop}</text>
          <line x1="${x(ladder.target)}" y1="40" x2="${x(ladder.target)}" y2="64" stroke="#20c997" stroke-width="3"/>
          <text x="${x(ladder.target)}" y="82" text-anchor="middle" font-size="11" fill="#20c997" font-weight="800">target $${ladder.target}</text>
          ${cur ? `<circle cx="${x(cur)}" cy="52" r="6" fill="#f6f3ea"/>
          <text x="${x(cur)}" y="20" text-anchor="middle" font-size="12" fill="#f6f3ea" font-weight="800">${ladder.ticker} $${cur}</text>` : ""}
        </svg>`;
      if (ladder.alpha) wrap.appendChild(noteEl(`Alpha: ${ladder.alpha}`));
      return wrap;
    }

    // North Star: glide path timeline อายุ (line+จุด)
    function renderGlideDetail(glide) {
      const wrap = document.createElement("div");
      const w = 440, h = 92, pad = 34;
      const x = (age) => pad + ((age - glide.startAge) * (w - pad * 2)) / Math.max(1, glide.targetAge - glide.startAge);
      const milestones = [
        [glide.startAge, "เริ่ม"], [glide.switchAge, "สับเกียร์"], [glide.targetAge, "เป้าหมาย"],
      ];
      wrap.innerHTML = `
        <svg class="vizSvg" viewBox="0 0 ${w} ${h}" role="img" aria-label="Glide path">
          <line x1="${pad}" y1="46" x2="${w - pad}" y2="46" stroke="rgba(255,255,255,.18)" stroke-width="4" stroke-linecap="round"/>
          <line x1="${x(glide.startAge)}" y1="46" x2="${x(glide.switchAge)}" y2="46" stroke="#7aa2ff" stroke-width="4" stroke-linecap="round"/>
          ${milestones.map(([age, label]) => `
            <circle cx="${x(age)}" cy="46" r="6" fill="#0b1020" stroke="#f6f3ea" stroke-width="2.5"/>
            <text x="${x(age)}" y="72" text-anchor="middle" font-size="11" fill="#a7aec5" font-weight="700">${age}</text>
            <text x="${x(age)}" y="86" text-anchor="middle" font-size="10" fill="#a7aec5">${label}</text>`).join("")}
          <circle cx="${x(glide.currentAge)}" cy="46" r="7" fill="#f9c74f"/>
          <text x="${x(glide.currentAge)}" y="26" text-anchor="middle" font-size="11" fill="#f9c74f" font-weight="800">ตอนนี้ ${glide.currentAge}</text>
        </svg>`;
      wrap.appendChild(noteEl(`${glide.phaseLabel} · เป้า ${glide.phaseTarget} (ต้องการ ${glide.requiredCagr}) · ${glide.note || ""}`));
      return wrap;
    }

    // Astro: gauge ครึ่งวง (LVGL lv_arc ได้ตรง ๆ)
    function renderGaugeDetail(gauge) {
      const wrap = document.createElement("div");
      const r = 70, cx = 110, cy = 92;
      const angle = Math.PI * (1 - gauge.score / 100);
      const px = cx + r * Math.cos(angle), py = cy - r * Math.sin(angle);
      const large = 0; // ครึ่งวงไม่เกิน 180° เสมอ
      const color = gauge.score >= 60 ? "#20c997" : gauge.score >= 40 ? "#f9c74f" : "#ff6b6b";
      wrap.innerHTML = `
        <svg class="vizSvg" viewBox="0 0 220 108" style="max-width:300px" role="img" aria-label="คะแนนดวง ${gauge.score}/100">
          <path d="M ${cx - r} ${cy} A ${r} ${r} 0 0 1 ${cx + r} ${cy}" fill="none" stroke="rgba(255,255,255,.10)" stroke-width="14" stroke-linecap="round"/>
          <path d="M ${cx - r} ${cy} A ${r} ${r} 0 ${large} 1 ${px} ${py}" fill="none" stroke="${color}" stroke-width="14" stroke-linecap="round"/>
          <text x="${cx}" y="${cy - 14}" text-anchor="middle" font-size="30" fill="#f6f3ea" font-weight="900">${gauge.score}</text>
          <text x="${cx}" y="${cy + 2}" text-anchor="middle" font-size="11" fill="#a7aec5" font-weight="700">/100 · ${gauge.verdict}</text>
        </svg>`;
      if (gauge.advice) wrap.appendChild(noteEl(gauge.advice));
      return wrap;
    }

    // AI usage: แถบ % ที่ใช้ไป
    function renderUsageDetail(extra) {
      const wrap = document.createElement("div");
      wrap.className = "viz";
      for (const u of extra.usage) {
        const row = document.createElement("div");
        row.className = "vRow";
        row.innerHTML = `<div><div class="vName"></div><div class="vSub"></div></div><div class="vTrack"><div class="vFill"></div></div><div class="vVal"></div>`;
        row.querySelector(".vName").textContent = u.name;
        row.querySelector(".vSub").textContent = `${u.cap} · ${u.reset}`;
        const fill = row.querySelector(".vFill");
        fill.style.width = `${u.used}%`;
        fill.style.background = u.used >= 80 ? "var(--danger)" : u.used >= 60 ? "var(--caution)" : "var(--ok)";
        row.querySelector(".vVal").textContent = `${u.used}%`;
        wrap.appendChild(row);
      }
      if (extra.note) wrap.appendChild(noteEl(extra.note));
      return wrap;
    }

    function showDetail(card) {
      stopLiveChart();
      detailToneEl.textContent = card.tone || "neutral";
      detailTitleEl.textContent = card.title || card.id || "-";
      detailValueEl.textContent = card.value || "-";
      detailTextEl.textContent = "";
      const extra = card.extra || {};
      if (extra.hourly || extra.forecast) {
        detailTextEl.appendChild(renderWeatherDetail(extra));
      } else if (extra.calendar) {
        detailTextEl.appendChild(renderCalendarDetail(extra.calendar));
      } else if (extra.themes) {
        detailTextEl.appendChild(renderThemesDetail(extra));
      } else if (extra.stocks) {
        detailTextEl.appendChild(renderStocksDetail(extra));
      } else if (extra.ladder) {
        detailTextEl.appendChild(renderLadderDetail(extra.ladder));
      } else if (extra.glide) {
        detailTextEl.appendChild(renderGlideDetail(extra.glide));
      } else if (extra.gauge) {
        detailTextEl.appendChild(renderGaugeDetail(extra.gauge));
      } else if (extra.usage) {
        detailTextEl.appendChild(renderUsageDetail(extra));
      } else {
        detailTextEl.textContent = card.detail || "";
      }
      detailViewEl.className = `detailView open ${card.tone || "neutral"}`;
      backEl.focus();
    }

    prevEl.addEventListener("click", () => { page -= 1; renderPage(); });
    nextEl.addEventListener("click", () => { page += 1; renderPage(); });
    backEl.addEventListener("click", () => { stopLiveChart(); detailViewEl.classList.remove("open"); });
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") { stopLiveChart(); detailViewEl.classList.remove("open"); }
      if (event.key === "ArrowLeft" && !prevEl.disabled) prevEl.click();
      if (event.key === "ArrowRight" && !nextEl.disabled) nextEl.click();
    });

    fetch(endpoint)
      .then((response) => {
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        return response.json();
      })
      .then(render)
      .catch((error) => {
        errorEl.textContent = `Run npm run dev:backend first. ${error.message}`;
      });
  </script>
</body>
</html>
