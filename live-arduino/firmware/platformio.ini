[platformio]
default_envs = esp32_035_serial

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; ponytail: CH340 บน Mac อ่าน/เขียนพลาดที่ 921600 (verify ล้มตอน read_flash) — 460800 นิ่งกว่า
upload_speed = 460800
build_src_filter = +<*> -<hw_selftest.cpp> -<app_main.cpp> -<fonts/>
lib_deps =
  bblanchon/ArduinoJson@^7.0.4
build_flags =
  -D CORE_DEBUG_LEVEL=3
  -D DEVICE_SUMMARY_URL=\"http://192.168.1.127:8787/api/device-summary\"

[env:esp32_035_serial]
build_flags =
  ${env.build_flags}
  -D DEVICE_PROFILE_ESP32_035=1
  -D DISPLAY_BACKEND_SERIAL=1

; TFT_eSPI config: pinout จาก vendor repo github.com/littleCdev/ESP32-035
; driver ยืนยันด้วยบอร์ดจริง 2026-07-25: ST7796 (320x480) — vendor ที่ใช้ ILI9341_2 ให้ 240x320 ผิดขนาด
[env:esp32_035_tft]
lib_deps =
  ${env.lib_deps}
  bodmer/TFT_eSPI@^2.5.34
  https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#v1.4
build_flags =
  ${env.build_flags}
  -D DEVICE_PROFILE_ESP32_035=1
  -D USER_SETUP_LOADED
  -D USE_HSPI_PORT
  -D ST7796_DRIVER
  -D TFT_MISO=12
  -D TFT_MOSI=13
  -D TFT_SCLK=14
  -D TFT_CS=15
  -D TFT_DC=2
  -D TFT_RST=-1
  -D TFT_BL=27
  -D TFT_BACKLIGHT_ON=HIGH
  -D SPI_FREQUENCY=55000000
  -D SPI_READ_FREQUENCY=20000000
  -D SPI_TOUCH_FREQUENCY=2500000
  -D LOAD_GLCD
  -D LOAD_FONT2
  -D LOAD_FONT4
  -D LOAD_FONT6
  -D LOAD_FONT7
  -D LOAD_FONT8
  -D LOAD_GFXFF

; Bring-up self-test: จอ/ทัช/RGB/LDR/เสียง — build เฉพาะ src/hw_selftest.cpp
[env:esp32_035_selftest]
build_src_filter = -<*> +<hw_selftest.cpp>
lib_deps = ${env:esp32_035_tft.lib_deps}
build_flags =
  ${env:esp32_035_tft.build_flags}
  -D TFT_DRIVER_LABEL=\"ST7796\"
  -D TOUCH_CS_PIN=33
  -D TOUCH_IRQ_PIN=36
  -D TOUCH_SCLK_PIN=14
  -D TOUCH_MISO_PIN=12
  -D TOUCH_MOSI_PIN=13
  -D RGB_R_PIN=4
  -D RGB_G_PIN=17
  -D RGB_B_PIN=16
  -D AUDIO_PIN=26
  -D LDR_PIN=34


; LVGL 9 + ฟอนต์ไทย Anuphan (แปลงจาก Google Fonts variable → lv_font_conv)
; ต้องใช้ huge_app partition: LVGL + ฟอนต์ 2 ขนาด กิน flash เกิน default 1.3MB
[env:esp32_035_lvgl]
board_build.partitions = huge_app.csv
build_src_filter = -<*> +<app_main.cpp> +<fonts/>
lib_deps =
  ${env:esp32_035_tft.lib_deps}
  lvgl/lvgl@^9.2.0
  https://github.com/tzapu/WiFiManager.git#v2.0.17
build_flags =
  ${env:esp32_035_selftest.build_flags}
  -D LV_CONF_SKIP=1
  -D LV_COLOR_DEPTH=16
  -D LV_MEM_SIZE=32768U
  -D LV_FONT_MONTSERRAT_14=1
  -D LV_USE_LOG=1
  -D LV_LOG_LEVEL=LV_LOG_LEVEL_WARN
  -D LV_LOG_PRINTF=1
